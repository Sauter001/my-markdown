<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>MyMD</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="app.css" />
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
</head>
<body data-view="split">
  <header id="topbar">
    <div class="tb-left">
      <span id="filename" title="현재 파일">제목 없음</span>
      <span id="dirtyDot" hidden>●</span>
    </div>
    <div class="tb-right">
      <button class="tb-btn" data-act="new"     title="새 파일">새 파일</button>
      <button class="tb-btn" data-act="open"    title="열기">열기</button>
      <button class="tb-btn" data-act="save"    title="저장">저장</button>
      <span class="tb-sep"></span>
      <div class="seg" role="group" aria-label="보기 모드">
        <button class="seg-btn" data-view="editor" title="에디터만 (Ctrl+1)" aria-label="에디터만">
          <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="3" y1="4.5" x2="13" y2="4.5"/><line x1="3" y1="8" x2="13" y2="8"/><line x1="3" y1="11.5" x2="9" y2="11.5"/></g></svg>
        </button>
        <button class="seg-btn" data-view="split" title="병치 (Ctrl+2)" aria-label="병치">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="8" y1="3" x2="8" y2="13" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="seg-btn" data-view="preview" title="미리보기만 (Ctrl+3)" aria-label="미리보기만">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.6 8s2.4-4.3 6.4-4.3S14.4 8 14.4 8 12 12.3 8 12.3 1.6 8 1.6 8z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/></svg>
        </button>
      </div>
      <span class="tb-sep"></span>
      <button class="tb-btn" data-act="settings" title="설정">⚙</button>
      <span class="tb-sep"></span>
      <div class="winctrl">
        <button class="wc-btn" data-win="min" title="최소화">&#x2500;</button>
        <button class="wc-btn" data-win="max" title="최대화/복원">&#x25A1;</button>
        <button class="wc-btn wc-close" data-win="close" title="닫기">&#x2715;</button>
      </div>
    </div>
  </header>

  <main id="workspace">
    <section id="editorPane">
      <textarea id="editor" spellcheck="false" autocomplete="off"
                autocapitalize="off" placeholder="여기에 마크다운을 입력하세요..."></textarea>
    </section>
    <div id="divider" title="드래그하여 너비 조절"></div>
    <section id="previewPane">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <!-- 설정 모달 -->
  <div id="settingsOverlay" hidden>
    <div id="settingsModal" role="dialog" aria-modal="true" aria-label="설정">
      <h2>설정</h2>

      <div class="set-grid">
        <label>기본 보기</label>
        <select id="set-defaultView">
          <option value="editor">에디터만</option>
          <option value="split">병치</option>
          <option value="preview">미리보기만</option>
        </select>

        <label>테마</label>
        <select id="set-theme">
          <option value="system">시스템</option>
          <option value="light">라이트</option>
          <option value="dark">다크</option>
        </select>

        <label>글꼴 크기(px)</label>
        <input id="set-fontSize" type="number" min="10" max="32" step="1" />

        <label>탭 크기(칸)</label>
        <input id="set-tabSize" type="number" min="1" max="8" step="1" />

        <label>자동 줄바꿈</label>
        <input id="set-wrap" type="checkbox" />

        <label>스크롤 동기화</label>
        <input id="set-scrollSync" type="checkbox" />
      </div>

      <h3>단축키</h3>
      <p class="hint">버튼을 누르고 원하는 키 조합을 입력하세요.</p>
      <div id="keymapList" class="keymap-list"></div>

      <div class="set-actions">
        <button id="set-reset" class="tb-btn">기본값 복원</button>
        <span style="flex:1"></span>
        <button id="set-cancel" class="tb-btn">취소</button>
        <button id="set-ok" class="tb-btn primary">저장</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
